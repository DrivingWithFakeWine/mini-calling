<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>mini_calling AI 助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f4f6f8; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1f2d3d; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  header .user { font-size: 13px; opacity: .8; }
  header button { background: #3b4a5f; color: #fff; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  header button:hover { background: #4a5d78; }
  #loginBar { background: #fff; padding: 10px 20px; border-bottom: 1px solid #e5e9ef; display: flex; gap: 8px; }
  #loginBar input { padding: 6px 10px; border: 1px solid #d5dbe3; border-radius: 4px; width: 160px; }
  #loginBar button { padding: 6px 18px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; line-height: 1.6; }
  .msg.user { align-self: flex-end; background: #3b82f6; color: #fff; border-bottom-right-radius: 2px; }
  .msg.ai { align-self: flex-start; background: #fff; border: 1px solid #e5e9ef; border-bottom-left-radius: 2px; }
  .msg.err { align-self: center; background: #fef2f2; color: #b91c1c; font-size: 13px; }
  .msg.trace { align-self: flex-start; background: #eef2ff; color: #4b5563; font-size: 12px; padding: 6px 10px; font-family: Consolas, monospace; }
  footer { display: flex; gap: 8px; padding: 14px 20px; background: #fff; border-top: 1px solid #e5e9ef; }
  footer input { flex: 1; padding: 10px 14px; border: 1px solid #d5dbe3; border-radius: 6px; }
  footer button { padding: 10px 26px; border: none; background: #3b82f6; color: #fff; border-radius: 6px; cursor: pointer; }
  footer button:disabled { background: #9db9e8; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <b>🤖 mini_calling AI 助手</b>
  <span style="display:flex; align-items:center; gap:12px;">
    <span class="user" id="whoami"></span>
    <button onclick="logout()">退出登录</button>
  </span>
</header>

<!-- 登录条：浏览器导航带不了 JWT，所以页面里自己调 /auth/login 换 token -->
<div id="loginBar">
  <input id="username" placeholder="用户名">
  <input id="password" type="password" placeholder="密码">
  <button onclick="login()">登录</button>
</div>

<div id="chat"></div>

<footer>
  <input id="input" placeholder="例如：帮我看看有哪些用户…（回车发送）" onkeydown="if(event.key==='Enter')send()">
  <button id="sendBtn" onclick="send()">发送</button>
</footer>

<script>
  // token 与会话 id 存内存：token 顺便放 localStorage，刷新页面免重登
  let token = localStorage.getItem('agent_token') || '';
  let sessionId = null;

  const chat = document.getElementById('chat');

  refreshMe();   // 页面加载时校验本地 token：有效则直接进入聊天，失效则回登录态

  function toggleLogin(loggedOut) {
    document.getElementById('loginBar').style.display = loggedOut ? 'flex' : 'none';
  }

  // 用 /auth/me 校验 token 并展示真实用户名；401 = token 过期，清理回登录态
  async function refreshMe() {
    if (!token) { toggleLogin(true); return; }
    try {
      const res = await fetch('/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
      if (res.status === 401) { doLogout(false); return; }
      const body = await res.json();
      const nick = body.data.nickname ? '（' + body.data.nickname + '）' : '';
      document.getElementById('whoami').textContent = '已登录：' + body.data.username + nick;
      toggleLogin(false);
    } catch (e) {
      toggleLogin(true);
    }
  }

  function doLogout(clearChat) {
    token = '';
    sessionId = null;
    localStorage.removeItem('agent_token');
    document.getElementById('whoami').textContent = '未登录';
    toggleLogin(true);
    if (clearChat) chat.innerHTML = '';
  }

  function logout() { doLogout(true); }

  function addMsg(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const res = await fetch('/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const body = await res.json();
    if (body.code !== 200) { alert('登录失败：' + body.message); return; }
    token = body.data.token;
    localStorage.setItem('agent_token', token);
    sessionId = null;                       // 换账号重新开始会话
    chat.innerHTML = '';                    // 清掉上一账号的聊天记录
    await refreshMe();
    addMsg('登录成功，开始提问吧～', 'ai');
  }

  async function send() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;
    addMsg(text, 'user');
    input.value = '';
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    const waiting = addMsg('思考中…', 'ai');

    // 事件驱动的渲染：首个 delta 到达时才创建 AI 气泡，之后逐段追加（打字机效果）
    let aiBubble = null;
    let reply = '';
    let currentEvent = null;
    let traceCard = null;

    const handle = (ev, data) => {
      if (ev === 'start') {
        sessionId = data.sessionId;                          // 会话 id 在首个事件就到手
      } else if (ev === 'delta') {
        if (!aiBubble) { waiting.remove(); aiBubble = addMsg('', 'ai'); }
        reply += data.text;
        aiBubble.textContent = reply;
        chat.scrollTop = chat.scrollHeight;
      } else if (ev === 'tool') {
        waiting.remove();
        traceCard = addMsg('🔧 ' + data.tool + '(' + (data.arguments || '{}') + ') 执行中…', 'trace');
      } else if (ev === 'tool_result') {
        if (traceCard) traceCard.textContent = traceCard.textContent.replace(' 执行中…', ' → ' + data.result);
      } else if (ev === 'error') {
        waiting.remove();
        addMsg('出错：' + data.message, 'err');
      }
    };

    try {
      const res = await fetch('/agent/chat/stream', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, 'Accept': 'text/event-stream'},
        body: JSON.stringify({message: text, sessionId: sessionId})
      });

      // 401 时 Security 返回的是 JSON 而不是事件流
      if (res.status === 401) { doLogout(false); addMsg('登录已过期，请重新登录', 'err'); return; }
      if (!res.ok || !res.body) {
        const body = await res.json().catch(() => ({}));
        waiting.remove();
        addMsg('出错了：' + (body.message || res.status), 'err');
        return;
      }

      // 手写 SSE 行协议解析：event: 行记事件名，data: 行取载荷并触发处理
      // （EventSource 不能带 JWT 请求头，所以我们用 fetch + ReadableStream）
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += decoder.decode(value, {stream: true});
        let idx;
        while ((idx = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (line.startsWith('event:')) {
            currentEvent = line.slice(6).trim();
          } else if (line.startsWith('data:')) {
            try { handle(currentEvent, JSON.parse(line.slice(5).trim())); } catch (e) { /* 忽略坏行 */ }
            currentEvent = null;
          }
        }
      }
      if (!aiBubble && waiting.parentNode) waiting.remove();   // 流结束仍无内容：收掉占位
    } catch (e) {
      if (waiting.parentNode) waiting.remove();
      addMsg('网络异常：' + e.message, 'err');
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
