server:
  port: 8080

spring:
  application:
    name: mini_calling
  profiles:
    active: local          # 👈 新增：默认激活 local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # url / username / password 挪走了
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.dking.mini_calling.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # secret 挪走了（它也是敏感信息！）
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

logging:
  level:
    com.dking.mini_calling: debug   # 顺便修正：原来写的 yourname.authsystem 包名不对
