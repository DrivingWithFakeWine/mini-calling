server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: "*"          # 注意引号
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: mini_calling
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.dking.mini_calling.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 上线前删
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  expiration: 600000
  header: Authorization
  prefix: "Bearer "

logging:
  level:
    com.dking.mini_calling: debug
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs          # OpenAPI JSON，Apifox 等工具可直接导入这个地址
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    operations-sorter: alpha    # 接口按字母排序，找起来方便
    tags-sorter: alpha
    try-it-out-enabled: true    # 启用 Try it out 调试按钮

# ──────── AI Agent 模块（Phase 0 起步） ────────
agent:
  base-url: https://open.bigmodel.cn/api/paas/v4   # 智谱 OpenAI 兼容端点（代码里拼 /chat/completions）
  api-key: ${ZHIPU_API_KEY:dummy-key}              # 真实 key 走环境变量注入，别提交进 git
  model: glm-4.6
  temperature: 0.6
  thinking-disabled: true                          # glm-4.6 默认深度思考，管理问答用不上，关掉换首字速度
  connect-timeout-ms: 5000
  read-timeout-ms: 120000                          # LLM 生成慢，读超时必须放大（RestClient 默认无限等）
  history-limit: 20                                # 每会话最多保留的消息条数，超限丢最旧
  session-ttl-minutes: 30                          # 会话空闲多久后清理
  max-rounds: 8                                    # agent 循环最大轮数，防模型无限打转
  stream-timeout-ms: 120000                        # SSE 长连接超时


